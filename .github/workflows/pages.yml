name: Publish GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static public site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html sammlung.html lesepfade.html quellen.html 404.html site.webmanifest .nojekyll _site/
          cp -R assets _site/assets
          cp -R werke _site/werke
          cp -R themen _site/themen
          cp -R personen _site/personen
          find _site -name '*.md' -o -name '_internal' -o -name '_topic_manifest.json' | sort
          if find _site -name '*.md' | grep -q .; then
            echo 'Markdown files must not be published.' >&2
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
